name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Claude Multi Account version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Desktop version
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: e.g. macOS 26.1, MacBook Pro M3
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Please remove anything personal (emails, account IDs) before posting.
